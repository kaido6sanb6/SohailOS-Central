name: Deploy SohailOS Cloudflare Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sohailos-gateway/**'
      - '.github/workflows/deploy-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/sohailos-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/sohailos-gateway/package.json
      - run: npm install
      - run: npx wrangler deploy --dry-run
      - name: Deploy Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/sohailos-gateway
          command: deploy
