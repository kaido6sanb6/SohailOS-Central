name: Deploy SohailOS Cloudflare Gateway
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sohailos-gateway/src/**'
      - 'cloudflare/sohailos-gateway/scripts/**'
      - 'cloudflare/sohailos-gateway/package.json'
      - 'cloudflare/sohailos-gateway/tsconfig.json'
      - 'cloudflare/sohailos-gateway/wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: sohailos-cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/sohailos-gateway
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/sohailos-gateway/package.json
      - name: Install dependencies and expose versions
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx wrangler --version
          node --version
          npm --version
      - run: npm run typecheck
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare deployment credentials."
            exit 1
          fi
      - name: Wrangler preflight and dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami
          npx wrangler deploy --dry-run
      - name: Sync Worker runtime secrets from GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOHAILOS_GATEWAY_TOKEN: ${{ secrets.SOHAILOS_GATEWAY_TOKEN }}
          SOHAILOS_OPENAI_API_KEY: ${{ secrets.SOHAILOS_OPENAI_API_KEY }}
          SOHAILOS_GEMINI_API_KEY: ${{ secrets.SOHAILOS_GEMINI_API_KEY }}
          SOHAILOS_ANTHROPIC_API_KEY: ${{ secrets.SOHAILOS_ANTHROPIC_API_KEY }}
          SOHAILOS_SUPABASE_URL: ${{ secrets.SOHAILOS_SUPABASE_URL }}
          SOHAILOS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOHAILOS_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "Synced Worker secret: $name"
            else
              echo "GitHub Actions secret not set; leaving existing Worker secret unchanged: $name"
            fi
          }
          sync_secret SOHAILOS_GATEWAY_TOKEN
          sync_secret SOHAILOS_OPENAI_API_KEY
          sync_secret SOHAILOS_GEMINI_API_KEY
          sync_secret SOHAILOS_ANTHROPIC_API_KEY
          sync_secret SOHAILOS_SUPABASE_URL
          sync_secret SOHAILOS_SUPABASE_SERVICE_ROLE_KEY
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/sohailos-gateway
          command: deploy
      - name: Smoke test public endpoints
        id: public_smoke
        working-directory: .
        env:
          SOHAILOS_GATEWAY_URL: https://sohailos-central.mydominetestq.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SOHAILOS_GATEWAY_URL/health")"
          echo "$health"
          echo "$health" | grep -q '"status":"ok"'
          root="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SOHAILOS_GATEWAY_URL/")"
          echo "$root"
          echo "$root" | grep -q 'SohailOS Cloudflare Gateway'
      - name: Verify provider runtime configuration
        id: provider
        working-directory: .
        env:
          SOHAILOS_GATEWAY_URL: https://sohailos-central.mydominetestq.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SOHAILOS_GATEWAY_URL/health")"
          echo "$health"
          if ! echo "$health" | grep -q '"providerConfigured":true'; then
            echo "::error::The Worker is deployed but no AI provider runtime secret is configured."
            exit 1
          fi
      - name: Smoke test authenticated MCP
        id: mcp_smoke
        working-directory: cloudflare/sohailos-gateway
        env:
          SOHAILOS_GATEWAY_URL: https://sohailos-central.mydominetestq.workers.dev
          SOHAILOS_GATEWAY_TOKEN: ${{ secrets.SOHAILOS_GATEWAY_TOKEN }}
          SOHAILOS_SMOKE_PROMPT: 'Reply with exactly: SOHAILOS_MCP_OK'
        run: node scripts/smoke-mcp.mjs
      - name: Automatic rollback after a successful deploy fails verification
        if: steps.deploy.outcome == 'success' && (steps.public_smoke.outcome == 'failure' || steps.provider.outcome == 'failure' || steps.mcp_smoke.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare/sohailos-gateway
        run: |
          set -euo pipefail
          echo "Post-deploy verification failed; rolling back to the previous Worker version."
          npx wrangler rollback --message "SohailOS automatic rollback after failed post-deploy verification"
      - name: Re-verify after rollback
        if: steps.deploy.outcome == 'success' && (steps.public_smoke.outcome == 'failure' || steps.provider.outcome == 'failure' || steps.mcp_smoke.outcome == 'failure')
        working-directory: .
        env:
          SOHAILOS_GATEWAY_URL: https://sohailos-central.mydominetestq.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SOHAILOS_GATEWAY_URL/health")"
          echo "$health"
          echo "$health" | grep -q '"status":"ok"'
      - name: Publish deployment evidence
        if: always()
        working-directory: .
        env:
          SOHAILOS_GATEWAY_URL: https://sohailos-central.mydominetestq.workers.dev
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "url=$SOHAILOS_GATEWAY_URL"
            echo "deploy_step=${{ steps.deploy.outcome }}"
          } > "$RUNNER_TEMP/deployment-evidence.txt"
          cat "$RUNNER_TEMP/deployment-evidence.txt"
