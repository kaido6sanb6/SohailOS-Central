# Continuous fork synchronization and verification
# Verification marker: GitHub App PEM normalization and validation.
# Operational probe: live credential rotation verification.
name: fork-sync-and-knowledge-refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fork-sync.yml"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: fork-sync-and-knowledge-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build fork inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_fork_inventory.py

      - name: Validate GitHub App private key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.SOHAILOS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_PRIVATE_KEY" ]; then echo "SOHAILOS_GITHUB_APP_PRIVATE_KEY is empty or unavailable."; exit 1; fi
          normalized="${RAW_PRIVATE_KEY//$'\r'/}"
          normalized="${normalized//\\n/$'\n'}"
          normalized="${normalized#\"}"; normalized="${normalized%\"}"; normalized="${normalized#\'}"; normalized="${normalized%\'}"
          work_key="$RUNNER_TEMP/sohailos-github-app.pem"
          printf '%s' "$normalized" > "$work_key"
          if ! grep -Eq '^-----BEGIN (RSA |EC |)PRIVATE KEY-----$' "$work_key"; then
            printf '%s' "$normalized" | base64 --decode > "$work_key" 2>/dev/null || { echo "GitHub App private key is not PEM or base64-encoded PEM."; exit 1; }
          fi
          grep -Eq '^-----BEGIN (RSA |EC |)PRIVATE KEY-----$' "$work_key" || { echo "Unsupported private-key format."; exit 1; }
          openssl pkey -in "$work_key" -noout >/dev/null || { echo "OpenSSL could not parse the private key."; exit 1; }
          echo "GitHub App private key validation passed."

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SOHAILOS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SOHAILOS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write

      - name: Verify GitHub App installation scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          count="$(gh api "/installation/repositories?per_page=1" --jq '.total_count')"
          test -n "$count" && test "$count" -ge 1
          echo "GitHub App installation exposes $count repositories."
          gh api --paginate "/installation/repositories?per_page=100" --jq '.repositories[].full_name' | sort -u > "$RUNNER_TEMP/installed-repositories.txt"
          python - <<'PY'
          import json
          inventory={x["full_name"] for x in json.load(open("ecosystem/generated/forks.json",encoding="utf-8"))["forks"]}
          installed={x.strip() for x in open("$RUNNER_TEMP/installed-repositories.txt",encoding="utf-8") if x.strip()}
          missing=sorted(inventory-installed)
          if missing:
              raise SystemExit("GitHub App installation is missing target repositories: " + ", ".join(missing))
          print(f"GitHub App installation covers all {len(inventory)} target forks.")
          PY

      - name: Sync forks with upstream
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/sync_forks.py

      - name: Validate fork inventory
        run: |
          python - <<'PY'
          import json
          data=json.load(open("ecosystem/generated/forks.json",encoding="utf-8")); forks=data.get("forks",[])
          assert data.get("fork_count")==len(forks)
          assert all(all(k in f for k in ("full_name","default_branch","upstream","source")) for f in forks)
          print(f"validated {len(forks)} fork records")
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Reconcile central registry
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj --configuration Release -- --owner kaido6sanb6 --manifest ecosystem/ecosystem.json --report "${{ runner.temp }}/ecosystem-reconciliation.json" --write --fail-on-removal

      - name: Commit fork inventory and sync report
        run: |
          git config user.name "SohailOS Fork Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosystem/ecosystem.json ecosystem/generated/forks.json ecosystem/generated/fork-sync-report.json
          git diff --cached --quiet || git commit -m "chore: refresh fork inventory and sync report"
          git push

      - name: Enforce synchronization gate
        if: always() && steps['app-token'].outcome == 'success' && steps.sync.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          s=json.load(open("ecosystem/generated/fork-sync-report.json",encoding="utf-8")).get("summary",{})
          b,e,c=(int(s.get(k,0)) for k in ("blocked","error","conflict"))
          if b or e or c: raise SystemExit(f"fork synchronization incomplete: blocked={b}, errors={e}, conflicts={c}")
          print("fork synchronization gate passed")
          PY

      - name: Publish synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-report
          path: |
            ecosystem/generated/forks.json
            ecosystem/generated/fork-sync-report.json
          if-no-files-found: error

      - name: Trigger ecosystem reconciliation and knowledge refresh
        if: always() && steps['app-token'].outcome == 'success' && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/dispatches" -f event_type=forks_reconciled
