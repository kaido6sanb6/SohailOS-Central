# Continuous fork synchronization and verification
name: fork-sync-and-knowledge-refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fork-sync.yml"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: fork-sync-and-knowledge-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build fork inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_fork_inventory.py

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SOHAILOS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SOHAILOS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Verify GitHub App installation scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          count="$(gh api "/installation/repositories?per_page=1" --jq '.total_count')"
          if [ -z "$count" ] || [ "$count" -lt 1 ]; then
            echo "GitHub App installation exposes no repositories."
            exit 1
          fi
          echo "GitHub App installation exposes $count repositories."

      - name: Sync forks with upstream
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: python scripts/sync_forks.py

      - name: Validate fork inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open("ecosystem/generated/forks.json", encoding="utf-8"))
          forks = data.get("forks", [])
          if data.get("fork_count") != len(forks):
              raise SystemExit("fork inventory count mismatch")
          for fork in forks:
              for key in ("full_name", "default_branch", "upstream", "source"):
                  if key not in fork:
                      raise SystemExit(f"fork record missing required field: {key}")
          print(f"validated {len(forks)} fork records")
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Reconcile central registry
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj --configuration Release -- --owner kaido6sanb6 --manifest ecosystem/ecosystem.json --report "${{ runner.temp }}/ecosystem-reconciliation.json" --write --fail-on-removal

      - name: Commit fork inventory and sync report
        shell: bash
        run: |
          git config user.name "SohailOS Fork Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosystem/ecosystem.json ecosystem/generated/forks.json ecosystem/generated/fork-sync-report.json
          git diff --cached --quiet || git commit -m "chore: refresh fork inventory and sync report"
          git push

      - name: Enforce synchronization gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = "ecosystem/generated/fork-sync-report.json"
          data = json.load(open(path, encoding="utf-8"))
          summary = data.get("summary", {})
          blocked = int(summary.get("blocked", 0))
          errors = int(summary.get("error", 0))
          conflicts = int(summary.get("conflict", 0))
          if blocked or errors or conflicts:
              raise SystemExit(
                  f"fork synchronization incomplete: blocked={blocked}, "
                  f"errors={errors}, conflicts={conflicts}"
              )
          print("fork synchronization gate passed")
          PY

      - name: Publish synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-report
          path: |
            ecosystem/generated/forks.json
            ecosystem/generated/fork-sync-report.json
          if-no-files-found: error

      - name: Trigger ecosystem reconciliation and knowledge refresh
        if: always() && steps.sync.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" -f event_type=forks_reconciled
