name: fork-sync-and-knowledge-refresh

on:
  workflow_dispatch:
    inputs:
      operation: {description: "Must be CREATE_SYNC_PR", required: true, type: string}
      target: {description: "Exact fork target", required: true, type: string}
      scope: {description: "Exact branch scope", required: true, type: string}
      intended_effect: {description: "Exact intended effect", required: true, type: string}
      risks: {description: "Known risks", required: true, type: string}
      rollback: {description: "Rollback plan", required: true, type: string}
      approval: {description: "Type APPROVE_CREATE_PR", required: true, type: string}
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: fork-ecosystem-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build fork inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_fork_inventory.py
      - name: Detect upstream divergence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_forks.py --fail-on-removal
      - name: Build capability graph and mutation plan
        run: python scripts/fork_ecosystem.py
      - name: Run ecosystem policy tests
        run: python -m unittest discover -s tests -p 'test_fork_ecosystem.py' -v
      - name: Validate plan
        run: |
          python - <<'PY'
          import json
          inv=json.load(open("ecosystem/generated/forks.json",encoding="utf-8"))
          rep=json.load(open("ecosystem/generated/fork-sync-report.json",encoding="utf-8"))
          plan=json.load(open("ecosystem/generated/fork-sync-plan.json",encoding="utf-8"))
          assert rep["fork_count"] == inv["fork_count"]
          assert plan["inventory_count"] == inv["fork_count"]
          assert plan["mutation"] is False
          assert all(a["operation"] in {"UPSTREAM_SYNC","OBSERVE"} for a in plan["actions"])
          print("ecosystem plan gate passed")
          PY
      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: fork-ecosystem-evidence
          path: |
            ecosystem/generated/forks.json
            ecosystem/generated/fork-sync-report.json
            ecosystem/generated/fork-graph.json
            ecosystem/generated/fork-sync-plan.json

  bounded-auto-sync:
    needs: reconcile
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.approval == 'APPROVE_CREATE_PR')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SOHAILOS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SOHAILOS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
      - name: Reconcile with mutation credential
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/build_fork_inventory.py
          python scripts/sync_forks.py --fail-on-removal
          python scripts/fork_ecosystem.py
      - name: Apply only bounded idempotent upstream sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOHAILOS_AUTOMATION_ENABLED: "true"
        run: python scripts/apply_fork_plan.py --max-targets 50
      - name: Verify post-mutation state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/sync_forks.py --fail-on-removal
      - name: Publish mutation evidence
        uses: actions/upload-artifact@v4
        with:
          name: fork-ecosystem-mutation-evidence
          path: ecosystem/generated/fork-sync-report.json

  approved-sync-pr:
    needs: reconcile
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.approval == 'APPROVE_CREATE_PR'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate exact approval binding
        env:
          OP: ${{ github.event.inputs.operation }}
          TARGET: ${{ github.event.inputs.target }}
          SCOPE: ${{ github.event.inputs.scope }}
          EFFECT: ${{ github.event.inputs.intended_effect }}
          RISKS: ${{ github.event.inputs.risks }}
          ROLLBACK: ${{ github.event.inputs.rollback }}
          APPROVAL: ${{ github.event.inputs.approval }}
        run: |
          set -euo pipefail
          test "$OP" = "CREATE_SYNC_PR"
          test "$APPROVAL" = "APPROVE_CREATE_PR"
          test -n "$TARGET"; test -n "$SCOPE"; test -n "$EFFECT"
          test -n "$RISKS"; test -n "$ROLLBACK"; test "$SCOPE" != "all"
      - uses: actions/checkout@v4
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SOHAILOS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SOHAILOS_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create review-gated upstream PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.event.inputs.target }}
          SCOPE: ${{ github.event.inputs.scope }}
          EFFECT: ${{ github.event.inputs.intended_effect }}
          RISKS: ${{ github.event.inputs.risks }}
          ROLLBACK: ${{ github.event.inputs.rollback }}
          OP: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          upstream="$(gh api "repos/$TARGET" --jq '.parent.full_name // empty')"
          test -n "$upstream"
          git fetch origin "$SCOPE"
          git checkout -B "automation/upstream-sync-${GITHUB_RUN_ID}" "origin/$SCOPE"
          git remote add upstream "https://github.com/${upstream}.git"
          git fetch --no-tags upstream "$SCOPE"
          git merge --no-edit "upstream/$SCOPE"
          git push --set-upstream origin "automation/upstream-sync-${GITHUB_RUN_ID}"
          gh pr create --repo "$TARGET" --base "$SCOPE" --head "automation/upstream-sync-${GITHUB_RUN_ID}" --title "chore: propose upstream synchronization" --body "Approval-bound proposal. Operation=$OP Target=$TARGET Scope=$SCOPE Effect=$EFFECT Risks=$RISKS Rollback=$ROLLBACK"
