name: fork-sync-and-knowledge-refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fork-sync.yml"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: fork-sync-and-knowledge-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build fork inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_fork_inventory.py

      - name: Sync forks with upstream
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SOHAILOS_GITHUB_SYNC_TOKEN }}
        shell: bash
        run: |
          set -u
          python - <<'PY
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          path = "ecosystem/generated/forks.json"
          data = json.load(open(path, encoding="utf-8"))
          results = []

          token = os.environ.get("GH_TOKEN")
          if not token:
              report = {
                  "schema_version": "1.0",
                  "generated_at": datetime.now(timezone.utc).isoformat(),
                  "owner": data["owner"],
                  "fork_count": len(data["forks"]),
                  "results": [{
                      "status": "blocked",
                      "reason": "SOHAILOS_GITHUB_SYNC_TOKEN is not configured"
                  }],
                  "summary": {
                      "synced": 0,
                      "conflict": 0,
                      "error": 0,
                      "skipped": 0,
                      "blocked": len(data["forks"])
                  }
              }
              os.makedirs("ecosystem/generated", exist_ok=True)
              with open(
                  "ecosystem/generated/fork-sync-report.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
              print("Cross-repository sync is blocked until SOHAILOS_GITHUB_SYNC_TOKEN is configured.")
              raise SystemExit(0)

          for fork in data["forks"]:
              repo = fork["full_name"]
              branch = fork["default_branch"]
              upstream = fork.get("upstream")

              if not upstream:
                  results.append({
                      "repo": repo,
                      "branch": branch,
                      "status": "skipped",
                      "reason": "upstream_not_exposed_by_github",
                  })
                  continue

              cmd = [
                  "gh", "api",
                  "--method", "POST",
                  f"repos/{repo}/merge-upstream",
                  "-f", f"branch={branch}",
              ]
              completed = subprocess.run(
                  cmd,
                  text=True,
                  capture_output=True,
                  env={**os.environ, "GH_TOKEN": token},
              )

              if completed.returncode == 0:
                  try:
                      payload = json.loads(completed.stdout or "{}")
                  except json.JSONDecodeError:
                      payload = {}
                  results.append({
                      "repo": repo,
                      "branch": branch,
                      "upstream": upstream,
                      "status": "synced",
                      "message": payload.get("message"),
                      "merge_type": payload.get("merge_type"),
                  })
              else:
                  stderr = (completed.stderr or completed.stdout or "").strip()
                  status = "conflict" if "409" in stderr or "conflict" in stderr.lower() else "error"
                  results.append({
                      "repo": repo,
                      "branch": branch,
                      "upstream": upstream,
                      "status": status,
                      "error": stderr[:2000],
                  })

          report = {
              "schema_version": "1.0",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "owner": data["owner"],
              "fork_count": len(data["forks"]),
              "results": results,
              "summary": {
                  "synced": sum(r["status"] == "synced" for r in results),
                  "conflict": sum(r["status"] == "conflict" for r in results),
                  "error": sum(r["status"] == "error" for r in results),
                  "skipped": sum(r["status"] == "skipped" for r in results),
                  "blocked": sum(r["status"] == "blocked" for r in results),
              },
          }

          os.makedirs("ecosystem/generated", exist_ok=True)
          with open(
              "ecosystem/generated/fork-sync-report.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)

          print(json.dumps(report["summary"], indent=2))
          PY

      - name: Validate fork inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open("ecosystem/generated/forks.json", encoding="utf-8"))
          forks = data.get("forks", [])
          if data.get("fork_count") != len(forks):
              raise SystemExit("fork inventory count mismatch")
          for fork in forks:
              for key in ("full_name", "default_branch", "upstream", "source"):
                  if key not in fork:
                      raise SystemExit(f"fork record missing required field: {key}")
          print(f"validated {len(forks)} fork records")
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Reconcile central registry
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj --configuration Release -- --owner kaido6sanb6 --manifest ecosystem/ecosystem.json --report "${{ runner.temp }}/ecosystem-reconciliation.json" --write --fail-on-removal

      - name: Commit fork inventory and sync report
        shell: bash
        run: |
          git config user.name "SohailOS Fork Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosystem/ecosystem.json ecosystem/generated/forks.json ecosystem/generated/fork-sync-report.json
          git diff --cached --quiet || git commit -m "chore: refresh fork inventory and sync report"
          git push

      - name: Enforce synchronization gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = "ecosystem/generated/fork-sync-report.json"
          data = json.load(open(path, encoding="utf-8"))
          summary = data.get("summary", {})
          blocked = int(summary.get("blocked", 0))
          errors = int(summary.get("error", 0))
          conflicts = int(summary.get("conflict", 0))
          if blocked or errors or conflicts:
              raise SystemExit(
                  f"fork synchronization incomplete: blocked={blocked}, "
                  f"errors={errors}, conflicts={conflicts}"
              )
          print("fork synchronization gate passed")
          PY

      - name: Publish synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-report
          path: |
            ecosystem/generated/forks.json
            ecosystem/generated/fork-sync-report.json
          if-no-files-found: error

      - name: Trigger ecosystem reconciliation and knowledge refresh
        if: always() && steps.sync.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" -f event_type=forks_reconciled
