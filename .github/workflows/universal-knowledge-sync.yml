name: universal-knowledge-sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [forks_reconciled]
  push:
    branches: [ main ]
    paths-ignore:
      - "ecosystem/generated/**"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: universal-knowledge-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build repository inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_universal_inventory.py

      - name: Resolve LIVE CORPUS revisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_live_corpus.py

      - name: Build and test
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore SohailOS.sln
      - run: dotnet build SohailOS.sln --configuration Release --no-restore
      - run: dotnet test tests/SohailOS.Tests/SohailOS.Tests.csproj --configuration Release --no-build

      - name: Index ecosystem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj --configuration Release -- --index --inventory ecosystem/generated/repositories.json --manifest ecosystem/ecosystem.json --index-report ecosystem/generated/index-report.json --knowledge-graph ecosystem/generated/knowledge-graph.json

      - name: Commit generated knowledge metadata
        run: |
          git config user.name "SohailOS Knowledge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecosystem/generated/repositories.json ecosystem/generated/live-corpus-state.json ecosystem/generated/index-report.json ecosystem/generated/knowledge-graph.json
          git diff --cached --quiet || git commit -m "chore: synchronize universal knowledge inventory"
          git push
