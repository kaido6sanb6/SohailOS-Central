name: Release SohailOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish WPF app
        run: dotnet publish src/SohailOS.App/SohailOS.App.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath SohailOS-win-x64.zip -Force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" SohailOS-win-x64.zip --generate-notes
      - name: Update manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash SohailOS-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SohailOS-win-x64.zip"
          @"
          {
            "version": "$version",
            "packageUrl": "$url",
            "sha256": "$sha"
          }
          "@ | Set-Content deploy/update-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/update-manifest.json
          git commit -m "Update release manifest for ${{ github.ref_name }}" || exit 0
          git push origin HEAD:main
