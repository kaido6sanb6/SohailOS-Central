name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SohailOS.sln
      - run: dotnet build SohailOS.sln --configuration Release --no-restore
      - run: dotnet test tests/SohailOS.Tests/SohailOS.Tests.csproj --configuration Release --no-build
