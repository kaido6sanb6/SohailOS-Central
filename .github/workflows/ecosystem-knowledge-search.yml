name: ecosystem-knowledge-search

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ecosystem-knowledge-search.yml"
  repository_dispatch:
    types:
      - forks_reconciled
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: ecosystem-knowledge-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build knowledge index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj
          --configuration Release --
          --owner kaido6sanb6
          --manifest ecosystem/ecosystem.json
          --index
          --index-path "${{ runner.temp }}/sohailos-knowledge-index.json"
          --index-report "${{ runner.temp }}/ecosystem-index-report.json"

      - name: Export provenance-rich search documents
        run: >
          dotnet run --project src/SohailOS.Ecosystem/SohailOS.Ecosystem.csproj
          --configuration Release --
          --export-search
          --index-path "${{ runner.temp }}/sohailos-knowledge-index.json"
          --search-export-path "${{ runner.temp }}/sohailos-search-export"
          --search-max-file-bytes 3500000

      - name: Publish knowledge fabric artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-knowledge-fabric
          path: |
            ${{ runner.temp }}/ecosystem-index-report.json
            ${{ runner.temp }}/sohailos-knowledge-index.json
            ${{ runner.temp }}/sohailos-search-export
          if-no-files-found: error
          retention-days: 30
